<!DOCTYPE html>
<html>
<head>
    <title>Complaint Form</title>
</head>
<body>
    <!-- Skip Navigation Link -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Screen Reader Announcements -->
    <div id="sr-announcer" aria-live="polite" aria-atomic="true" class="sr-only"></div>

<h2>Register a Complaint</h2>
<form method="post" action="complaint.php">
    <label for="customer_name">Customer Name:</label><br>
    <input type="text" id="customer_name" name="customer_name" required><br>
    
    <label for="customer_email">Customer Email:</label><br>
    <input type="email" id="customer_email" name="customer_email" required><br>
    
    <label for="complaint">Complaint:</label><br>
    <textarea id="complaint" name="complaint" rows="4" required></textarea><br>
    
    <input type="submit" value="Submit">
</form>


    <!-- Reduced Motion Support -->
    <script>
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.style.setProperty('--animation-duration', '0.01ms');
        document.documentElement.style.setProperty('--transition-duration', '0.01ms');
    }
    </script>
</body>
</html>
